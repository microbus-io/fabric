# Configuration properties defined in config.yaml affect applications running in any descendant subdirectory

all:
  Example: value

my.service:
  Example: value

foreman.core:
  # Shards declares one entry per database shard. Left unset, a LOCAL deployment opens a single SQLite file.
  # Shards: '[{"index":1,"dsn":"postgres://user:pass@db1:5432/flows","maxConnections":0}]'
  # Workers is an expert override; leave it at -1 to let the engine derive it.
  # Workers: -1
  # MaxPriority is the number of priority levels; set the same value on every replica.
  # MaxPriority: 5

llm.core:
  # MaxToolRounds: 10

http.ingress.core:
  # Ports: 8080
  # TimeBudget: 20s

petstore.example:
  # RemoteBaseURL: https://petstore3.swagger.io/api/v3
